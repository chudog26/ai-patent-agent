# =============================================================================
# 一键部署：数据库 + 应用
#
#   1. cp .env.example .env        （填好 DATABASE_URL 之外的 AI 相关变量，可留空）
#   2. docker compose up -d --build
#   3. 打开 http://localhost:5000 ，按引导创建管理员
#
# 数据库结构会在容器首次启动时由 sql/init.sql 自动创建，无需手动执行迁移。
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: patent-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: patent_agent
      # 中文内容排序更稳妥
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动建表（仅当数据卷为空时执行）
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d patent_agent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 默认只在本机暴露，需要外部连接时再打开
    ports:
      - '127.0.0.1:5432:5432'

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patent-agent-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 覆盖 .env 里的 DATABASE_URL，指向 compose 网络内的数据库
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/patent_agent
      DATABASE_SSL: 'false'
      NODE_ENV: production
      PORT: '5000'
      # 用于加密存储用户填写的 API Key，生产环境请改成自己的随机串
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      # 以下均可留空，改在「管理后台 → AI 服务配置」里图形化填写
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-tavily}
      SEARCH_API_KEY: ${SEARCH_API_KEY:-}
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
    ports:
      - '5000:5000'

volumes:
  pgdata:
    driver: local
